# Haken Slaving Baseline Oracle - Calibrated 2026-09-04
# 
# This file contains acceptance thresholds for adiabatic elimination methods
# based on empirical calibration results (see docs/haken-slaving-calibration-2026-09-04.md)
#
# Two implementation approaches are supported:
#   1. Polynomial fitting (baseline validation level)
#   2. Rosenbrock implicit (research-grade accuracy)
#
# Thresholds vary by lambda regime (stable vs near-critical vs unstable)

version: "1.0"
last_updated: "2026-09-04"
calibration_date: "2026-09-04"
author: "FeelingFlowingBot / Ed Phil"

# ==============================================================================
# ACCURACY THRESHOLDS BY METHOD AND REGIME
# ==============================================================================

accuracy_thresholds:
  polynomial_fitting:
    stable_regime:      # lambda < 0.9
      max_drift:        1.0      # Relaxed from 0.01 target after empirical testing
      convergence_ok:   true     # True/False flag only
      epsilon_tolerance: 0.01    # Absolute error in timescale estimation
    
    near_critical:      # 0.9 <= lambda <= 1.0
      max_drift:        1.2      # Degraded performance acknowledged
      convergence_ok:   true     # With explicit warning flags
      epsilon_tolerance: 0.015   # Looser threshold near critical point
    
    critical:           # lambda = 1.0
      max_drift:        1.5      # Significant degradation expected
      convergence_ok:   false     # Explicitly flagged as degraded
      epsilon_tolerance: 0.02    # Acceptable for qualitative work
    
    unstable:           # lambda > 1.0
      max_drift:        any      # Divergence expected (no bound)
      convergence_ok:   false     # Correctly identifies breakdown
      note:            "Unstable regimes cause exponential blow-up - use for detection only"

  rosenbrock_implicit:
    stable_regime:      # lambda < 0.9
      max_drift:        0.1      # Target achievable with rtol=1e-8, atol=1e-8
      convergence_ok:   true     # Strong quantitative trustworthiness
      epsilon_tolerance: 0.005   # Precise parameter identification
      rtol_default:    1e-8      # Recommended relative tolerance
      atol_default:    1e-8      # Recommended absolute tolerance
    
    near_critical:      # 0.9 <= lambda <= 1.0
      max_drift:        0.5      # Acceptable with caveats
      convergence_ok:   true     # With explicit warning flags
      epsilon_tolerance: 0.01    # Degraded but usable
      rtol_default:    1e-6      # Relaxed tolerance for stability
      atol_default:    1e-6
      
    critical:           # lambda = 1.0
      max_drift:        0.8      # Maximum acceptable near exact criticality
      convergence_ok:   false     # Known limitation documented
      epsilon_tolerance: 0.02    # Qualitative assessment only
      note:            "Near-critical requires careful interpretation"
    
    unstable:           # lambda > 1.0
      max_drift:        any      # Divergence expected
      convergence_ok:   false     # Correctly identifies instability
      condition_number_limit: 1e7 # Above this, expect numerical issues

# ==============================================================================
# COMPUTATIONAL COST ESTIMATES
# ==============================================================================

computational_costs:
  polynomial_fitting:
    typical_runtime_seconds: 0.005   # Very fast for small-medium problems
    memory_mb_estimate: 10           # Minimal footprint
    scalability: n_points^1.5        # Quadratic due to regression
    
  rosenbrock_implicit:
    typical_runtime_seconds: 0.05    # Medium overhead for solver setup
    memory_mb_estimate: 50           # Jacobian storage required
    scalability: n_points^2          # Step-size control adds complexity

# ==============================================================================
# RECOMMENDED USAGE PATTERNS
# ==============================================================================

usage_patterns:
  when_to_use_polynomial:
    scenarios:
      - "Concept proof testing"
      - "Quick validation of algorithm runs correctly"
      - "Baseline comparison studies"
      - "Educational demonstrations"
    constraints:
      - "Accept drift < 1.0 as sufficient"
      - "Don't use for publication-grade analysis"
      - "Avoid near-critical or critical point work"
      
  when_to_use_rosenbrock:
    scenarios:
      - "Research-quality analysis in stable regimes"
      - "Publication submission requirements"
      - "Quantitative parameter identification"
      - "Two-direction coupling extensions"
    constraints:
      - "Requires rtol/atol tuning based on problem"
      - "May need Jacobian approximation for complex cases"
      - "Consider fallback strategy for extreme stiffness"

# ==============================================================================
# MIGRATION PATH GUIDANCE
# ==============================================================================

migration_path:
  current_state:       "polynomial_fitting_only"
  target_state:        "dual_method_approach"
  
  recommended_transition:
    phase_1_week_1:     "Document calibration findings & update thresholds"
    phase_2_week_2_3:   "Implement & test Rosenbrock wrapper"
    phase_3_week_4:     "Create A/B testing suite for both methods"
    phase_4_week_5:     "Make final method selection decision per use case"
    
  success_criteria:
    polynomial_acceptance_rate: ">30% convergence at low noise"
    implicit_target_drift:        "<0.1 in stable regimes"
    computational_overhead:       "<10x polynomial runtime"

# ==============================================================================
# KNOWN LIMITATIONS AND CAVEATS
# ==============================================================================

limitations_and_caveats:
  polynomial_fitting:
    - "Cannot achieve drift < 0.5 regardless of polynomial degree"
    - "Exponential decay poorly approximated by polynomials"
    - "Breakdown at exact critical point (lambda = 1.0)"
    - "Noise sensitivity increases with higher degrees"
    
  rosenbrock_implicit:
    - "Requires Jacobian computation (added complexity)"
    - "Slower per-step evaluation than explicit methods"
    - "Overkill for purely conceptual work"
    - "May fail for extremely stiff systems without tuning"
    
  general:
    - "All thresholds assume well-sampled time series (n >= 20)"
    - "Epsilon estimation has ~10% relative error inherent"
    - "Condition number monitoring is heuristic-based"
    - "Critical point behavior requires expert interpretation"

