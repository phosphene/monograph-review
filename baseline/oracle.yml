# baseline/oracle.yml — Ground truth for all §12 results
#
# Every value is the manuscript-reported result. Tolerance is absolute.
# When results diverge, either update the baseline with proof or fix the regression.
#
# supports_vi: does the result support the valence prediction?
# distinguishes_from_competitor: does the result distinguish valence from the named competitor?
#   (false = competitor predicts the same pattern; caveat required)

t1_orobanchaceae_pgls:
  prediction: "Plastome size correlates with parasitism level"
  competitor: "Relaxed selection (Lahti et al. 2009)"
  values:
    beta: -23.5              # kb per parasitism level
    r_squared: 0.652
    p_value: 1.25e-9
    n_species: 12
  tolerance: 0.001
  supports_vi: true
  distinguishes_from_competitor: false
  caveat: "Relaxed selection predicts the same gradient. Caveat in paper §12.1.2."

t2_cross_family:
  prediction: "Family-mean plastome size correlates with family-mean parasitism across independent parasitic lineages (between-family association)"
  competitor: "Stochastic gene loss"
  values:
    pearson_r: -0.934
    n: 15              # family-level (15 families), not species-level (91)
    p_value: 1.39e-41
  tolerance: 0.001
  supports_vi: true
  distinguishes_from_competitor: false
  caveat: "Also predicted by relaxed selection on photosynthetic genes."

t3_endosymbiont_biphasic:
  prediction: "Genome reduction follows biphasic kinetics (fast then slow)"
  competitor: "Constant rate (Lynch 2007), accelerating (Muller's ratchet)"
  values:
    r_squared: 0.920
    k1_k2_ratio: 19.0
    bayes_factor: 6.7          # logistic vs exponential
  tolerance: 0.01
  supports_vi: true
  distinguishes_from_competitor: true
  caveat: "n=10 genera; sensitivity to individual data points not fully tested."

t4_niche_vs_ne:
  prediction: "Niche breadth predicts gene loss better than Ne alone"
  competitor: "Drift (Lynch 2007)"
  values:
    niche_r_squared: 0.343
    ne_r_squared: 0.198
  tolerance: 0.001
  supports_vi: true
  distinguishes_from_competitor: true
  caveat: null

t5_pangenome_fluidity:
  prediction: "Pan-genome openness tracks lifestyle (commensal vs free-living)"
  competitor: "Ne-only model"
  values:
    lifestyle_subsumes_ne: true
  tolerance: 0.001
  supports_vi: true
  distinguishes_from_competitor: true
  caveat: null

t6_gene_loss_ordering:
  prediction: "Integration-depth determines gene-loss order"
  competitor: "Random loss"
  values:
    spearman_orobanchaceae: 0.955
    spearman_cuscuta: 0.986
    cross_family_concordance: 0.941
    permutation_p: 0.0083     # 6/720 exact permutation
    quasibinomial_p: 0.0001
    pseudo_r_squared: 0.82
  tolerance: 0.001
  supports_vi: true
  distinguishes_from_competitor: true
  caveat: null

t7_ltee_cosegregation:
  prediction: "Function-loss mutations co-segregate with beneficial mutations LESS than chance (passive drift in unused genes)"
  competitor: "Independent assortment"
  values:
    observed_pct: 36.4
    expected_pct: 61.7
    p_value: 0.0001
  tolerance: 0.001
  supports_vi: true
  distinguishes_from_competitor: false
  caveat: "Hitchhiking confound; arbitrary window; misspecified null. Reported as suggestive."

formal_model:
  prediction: "Biphasic kinetics: fast Phase 1 (unprotected traits shed), slow Phase 2 (protected traits retained)"
  competitor: "Constant rate (relaxed selection), accelerating (Muller's ratchet)"
  # These are DETERMINISTIC ODE outputs (regression targets), not empirical
  # values. The threshold_model is fully deterministic (A2: no RNG), so these
  # are exact. threshold_biphasicity ~ 1.0 is the real biphasic signature:
  # protected traits (d >= theta) retain at 1.0, unprotected (d < theta) shed
  # to ~0. early_late_displacement_ratio is a descriptive temporal displacement
  # ratio (large when the exponential decay finishes early), NOT a rate ratio.
  # The empirical biphasic test on real endosymbiont data is T3; this entry
  # guards the theoretical model's numerics against code regressions.
  values:
    phase1_rate: 0.9999964
    phase2_rate: 3.558952e-06
    early_late_displacement_ratio: 280980.5944134
    threshold_biphasicity: 1.0
  tolerance: 0.001
  supports_vi: true
  distinguishes_from_competitor: true
  caveat: "Deterministic ODE outputs (final_retention = [~0, ~0, ~0, 1, 1] for depths [0,1,2,3,5] with theta=2.5). Not empirical — see T3 for the empirical biphasic test."

empirical_formal_model:
  prediction: "Additive GLM (retention ~ dep + para): dep > 0 (protected), para < 0 (shed); cross-kingdom rho > 0"
  competitor: "dep <= 0 (random loss), para ns (relaxed selection), rho <= 0 (no transfer)"
  # These are EMPIRICAL values from the corrected additive GLM fit to the
  # 8x6 Orobanchaceae retention matrix (Remark R7). The author's original
  # script had a data-flattening bug (as.vector(t(retention)) is species-major;
  # rep(dep_scores, each=8) is gene-major) that scrambled dep <-> retention
  # and produced the wrong sign (dep = -0.83). With the corrected flattening
  # (as.vector(retention), gene-major), the GLM confirms valence: dep = +0.84
  # (p=0.0008), para = -1.86 (p<0.0001), pseudo-R2 = 0.55, cross-kingdom
  # rho = +0.755. The GLM is deterministic (A2: no RNG), so these are exact.
  # The theoretical companion is threshold_model (the ODE simulation above).
  # See docs/review/formal-model-reproduction.md.
  values:
    dep_coefficient: 0.8374952425
    dep_p_value: 0.0007557440
    para_coefficient: -1.8643890088
    para_p_value: 0.0000350239
    pseudo_r_squared: 0.5515413228
    cross_kingdom_rho: 0.7545045450
    cross_kingdom_p: 0.0305127590
    dep_positive: true
    para_negative: true
    Valence_confirmed: true
  tolerance: 0.001
  supports_vi: true
  distinguishes_from_competitor: true
  caveat: "Empirical GLM fit to the 8x6 retention matrix (corrected flattening, Remark R7). The foundry's theoretical ODE (threshold_model) is the companion simulation; this is the empirical test that can fail."

cross_kingdom_l3:
  prediction: "Plant-derived slope SIGN predicts bird morphological change ordering (ordering-concordance transfer; slope magnitude does not transfer)"
  competitor: "Substrates are independent — no parameter transfer"
  values:
    bird_rho: 0.755
    bird_p: 0.031
  tolerance: 0.01
  supports_vi: true
  distinguishes_from_competitor: true
  caveat: "Ordering transfers across kingdoms; rate does not."
