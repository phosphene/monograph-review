name: Setup R dependencies
description: >-
  Install R system + package dependencies with a GitHub Actions cache.
  Designed for the rocker/tidyverse:4.5.3 container. Caches the site
  library so the ~23-package install (normally 6+ min) runs once and is
  reused by every subsequent job in the sequential CI chain.

runs:
  using: composite

  steps:
    # System deps — libpq-dev for RPostgres/DBI. Fast (~10s); not cached.
    - name: Install system dependencies
      shell: bash
      run: |
        apt-get update && apt-get install -y --no-install-recommends libpq-dev
        rm -rf /var/lib/apt/lists/*

    # Cache the R site library. Keyed on the container tag + a hash of this
    # file, so changing the package list below automatically invalidates the
    # cache. restore-keys lets a new key fall back to the nearest previous
    # cache and install only the diff.
    #
    # The jobs are sequential (lint -> unit -> simulacra -> ... -> check),
    # so the first job (lint) populates the cache and every subsequent job
    # gets a hit. The site library includes rocker's pre-installed packages
    # (tidyverse etc.) plus our additions; caching the whole directory is
    # fine within GitHub's 10 GB limit.
    - name: Cache R library
      uses: actions/cache@v4
      with:
        path: /usr/local/lib/R/site-library
        key: r-deps-rocker-4.5.3-${{ hashFiles('.github/actions/setup-r-deps/action.yml') }}
        restore-keys: |
          r-deps-rocker-4.5.3-

    # Comprehensive package list (union of all jobs' needs). We call
    # install.packages directly (not setdiff + install) because it checks
    # each package against CRAN and updates if a newer version is available.
    # This matters: the rocker container ships roxygen2 7.3.3, but CRAN has
    # 8.x — the old workflow's install.packages updated it; a setdiff-only
    # approach would keep the stale version and hit bugs. On a cache hit
    # (all current), this is fast — just a metadata check, no download.
    # Ncpus = 2 parallelises the install on GitHub's 2-core runners.
    - name: Install R packages
      shell: Rscript {0}
      run: |
        pkgs <- c(
          "testthat", "withr", "covr", "mockery", "R6", "yaml", "ggplot2",
          "roxygen2", "readxl", "knitr", "rmarkdown", "patchwork", "dplyr",
          "viridis", "ape", "caper", "phytools", "base64enc", "DBI",
          "RPostgres", "lintr", "styler", "rcmdcheck",
          "minpack.lm"
        )
        already <- rownames(installed.packages())
        missing <- setdiff(pkgs, already)
        if (length(missing) > 0) {
          message("Installing missing packages: ", paste(missing, collapse = ", "))
          install.packages(missing, repos = Sys.getenv("R_REPOS"), Ncpus = 2)
        }
        # Check for outdated packages and update (e.g. container's roxygen2
        # 7.3.3 -> CRAN's 8.x). install.packages skips packages already at
        # the latest version, so this is fast on a cache hit.
        old <- old.packages(repos = Sys.getenv("R_REPOS"))
        if (!is.null(old)) {
          to_update <- intersect(pkgs, rownames(old))
          if (length(to_update) > 0) {
            message("Updating outdated packages: ", paste(to_update, collapse = ", "))
            install.packages(to_update, repos = Sys.getenv("R_REPOS"), Ncpus = 2)
          }
        }
        if (length(missing) == 0 && (is.null(old) || length(intersect(pkgs, rownames(old))) == 0)) {
          message("All ", length(pkgs), " packages installed and current (cache hit).")
        }
