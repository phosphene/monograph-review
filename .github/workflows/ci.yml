name: The Foundry CI

on:
  push:
    branches: [main, "feature/**"]
  pull_request:
    branches: [main]
  workflow_dispatch:

env:
  R_REPOS: "https://cloud.r-project.org/"

jobs:
  lint:
    runs-on: ubuntu-latest
    continue-on-error: true
    container: rocker/tidyverse:4.5.3
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup-r-deps
      - name: Style check
        run: |
          Rscript -e "
            result <- tryCatch(
              styler::style_dir('R/', dry = 'warn'),
              error = function(e) { message('Styler error: ', e$message); NULL }
            )
            message('Style check complete')
          "
      - name: Lint package
        run: |
          Rscript -e "
            lints <- lintr::lint_package()
            if (length(lints) > 0) {
              print(lints)
              stop('Lint failed: ', length(lints), ' issues found')
            } else {
              message('No lint issues.')
            }
          "

  unit:
    runs-on: ubuntu-latest
    container: rocker/tidyverse:4.5.3
    needs: lint
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup-r-deps
      - name: Generate NAMESPACE
        run: Rscript -e "roxygen2::roxygenize('.', load_code=roxygen2::load_source)"
      - name: Install package
        run: R CMD INSTALL .
      - name: Run unit tests
        run: Rscript run_tests.R unit
      - name: Check coverage
        run: |
          Rscript scripts/coverage_report.R
      - name: Upload coverage
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage-report
          path: coverage-report.json
          retention-days: 7

  simulacra:
    runs-on: ubuntu-latest
    container: rocker/tidyverse:4.5.3
    needs: unit
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup-r-deps
      - name: Generate NAMESPACE and install
        run: |
          Rscript -e "roxygen2::roxygenize('.', load_code=roxygen2::load_source)"
          R CMD INSTALL .
      - name: Run simulacra tests
        run: Rscript run_tests.R simulacra
      - name: Emit simulacrum marks
        run: Rscript scripts/run_simulacra.R --n-sims 20
      - name: Generate visualizations
        run: Rscript scripts/generate_viz.R
      - name: Upload simulacra results
        uses: actions/upload-artifact@v4
        with:
          name: simulacra-results
          path: results/
      - name: Upload regenerated pages HTML
        uses: actions/upload-artifact@v4
        with:
          name: pages-html
          path: docs/*.html
          retention-days: 7

  integration:
    runs-on: ubuntu-latest
    container: rocker/tidyverse:4.5.3
    needs: simulacra
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup-r-deps
      - name: Generate NAMESPACE and install
        run: |
          Rscript -e "roxygen2::roxygenize('.', load_code=roxygen2::load_source)"
          R CMD INSTALL .
      - name: Run integration tests
        run: Rscript run_tests.R integration

  regression:
    runs-on: ubuntu-latest
    container: rocker/tidyverse:4.5.3
    needs: integration
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup-r-deps
      - name: Generate NAMESPACE and install
        run: |
          Rscript -e "roxygen2::roxygenize('.', load_code=roxygen2::load_source)"
          R CMD INSTALL .
      - name: Run regression tests
        run: Rscript run_tests.R regression

  check:
    runs-on: ubuntu-latest
    container: rocker/tidyverse:4.5.3
    needs: regression
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup-r-deps
      - name: Generate NAMESPACE and install
        run: |
          Rscript -e "roxygen2::roxygenize('.', load_code=roxygen2::load_source)"
          R CMD INSTALL .
      - name: R CMD check
        run: Rscript -e "rcmdcheck::rcmdcheck('.', args = c('--no-manual', '--as-cran'), error_on = 'error')"

  pages:
    runs-on: ubuntu-latest
    needs: [simulacra]
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Download regenerated pages HTML
        uses: actions/download-artifact@v4
        with:
          name: pages-html
          path: docs/
      - name: Verify pages HTML
        run: |
          test -f docs/index.html
          test -f docs/simulacra.html
          test -f docs/baseline-oracle.html
          test -f docs/key-results.html
          test -f docs/toy-models.html
          grep -q "Toy Models" docs/toy-models.html
          grep -q "Simulacra" docs/simulacra.html
          echo "Pages HTML verified: 5 pages present"
      - name: Commit regenerated pages to main
        if: github.ref == 'refs/heads/main' && github.event_name == 'push'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add docs/*.html docs/*.md
          if git diff --cached --quiet; then
            echo "No changes to docs/"
          else
            git commit -m "docs(pages): auto-regenerate multi-page site with latest simulacra marks [skip ci]"
            git push
          fi

  summary:
    runs-on: ubuntu-latest
    needs: [lint, unit, simulacra, integration, regression, check, pages]
    if: always()
    steps:
      - run: |
          echo "## CI Summary" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "| Gate | Status |" >> $GITHUB_STEP_SUMMARY
          echo "|------|--------|" >> $GITHUB_STEP_SUMMARY
          echo "| Lint | ${{ needs.lint.result }} |" >> $GITHUB_STEP_SUMMARY
          echo "| Unit Tests | ${{ needs.unit.result }} |" >> $GITHUB_STEP_SUMMARY
          echo "| Simulacra | ${{ needs.simulacra.result }} |" >> $GITHUB_STEP_SUMMARY
          echo "| Integration | ${{ needs.integration.result }} |" >> $GITHUB_STEP_SUMMARY
          echo "| Regression | ${{ needs.regression.result }} |" >> $GITHUB_STEP_SUMMARY
          echo "| R CMD Check | ${{ needs.check.result }} |" >> $GITHUB_STEP_SUMMARY
          echo "| Pages | ${{ needs.pages.result }} |" >> $GITHUB_STEP_SUMMARY
